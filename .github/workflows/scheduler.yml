name: XAUUSD M15 Strategy Scheduler

on:
  schedule:
    # Triggers every 15 minutes, 2 minutes after candle close (:02, :17, :32, :47)
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

concurrency:
  group: xauusd-m15-scheduler
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-signal-bot:
    name: Execute M15 Strategy Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite Verification
        run: |
          python -m unittest test_strategy.py

      - name: Execute Strategy Single Scan (--once)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py --once

